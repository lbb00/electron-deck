name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref supersedes the running verification — cancel it
# instead of finishing a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      # Also runs the trust-seal, docs-api-sync, browser-purity and
      # file-extensions gates.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Both gates read dist/, so they must follow Build. Running them here (not
      # only in prepack) means a size regression or a tree-shaking leak fails
      # the PR instead of surfacing at publish time.
      - name: Check bundle size
        run: pnpm run check:bundle-size

      - name: Check tree shaking
        run: pnpm run check:tree-shaking

      - name: Check dockable interactions
        run: xvfb-run --auto-servernum pnpm run check:e2e
        env:
          DECK_E2E_OUTPUT_DIR: ${{ runner.temp }}/dockable-e2e
          DECK_E2E_NO_SANDBOX: '1'

      # The peer range promises the oldest Electron below; run the same e2e on
      # it so the floor stays true. The version is read from package.json.
      - name: Check dockable interactions on the oldest supported Electron
        run: |
          floor=$(node -p "require('./package.json').peerDependencies.electron.replace(/^>=/, '')")
          npm install --prefix "$RUNNER_TEMP/electron-floor" --no-save --no-package-lock "electron@$floor"
          ELECTRON_OVERRIDE_DIST_PATH="$RUNNER_TEMP/electron-floor/node_modules/electron/dist" \
            xvfb-run --auto-servernum pnpm run check:e2e
        env:
          DECK_E2E_OUTPUT_DIR: ${{ runner.temp }}/dockable-e2e-floor
          DECK_E2E_NO_SANDBOX: '1'

      - name: Upload dockable interaction diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dockable-e2e-diagnostics
          path: |
            ${{ runner.temp }}/dockable-e2e
            ${{ runner.temp }}/dockable-e2e-floor
          if-no-files-found: ignore

  # Native view composition is where the platforms differ: child view stacking,
  # WebContentsView teardown and window activation all have their own behaviour
  # per OS. The rest of the gates are platform-independent, so only the
  # interaction e2e repeats here. Linux is covered by `verify` above, which also
  # runs it on the oldest supported Electron.
  #
  # This runs check:e2e:interactions, not check:e2e: the latter also runs the
  # wrapper script's own unit tests, which assert POSIX process-group
  # termination (process.kill on a negative pid, a shell stub holding the group
  # open) and have no Windows equivalent. Those run on Linux only, in `verify`.
  # The wrapper's one Windows-specific line — resolving Electron
  # through require() instead of node_modules/.bin — is exercised here anyway,
  # because it is the only path that starts Electron on Windows.
  e2e-platforms:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the other platform's result.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The demo main process imports dist/, so the build has to come first.
      - name: Build
        run: pnpm run build

      - name: Check dockable interactions
        run: pnpm run check:e2e:interactions
        env:
          DECK_E2E_OUTPUT_DIR: ${{ runner.temp }}/dockable-e2e

      - name: Upload dockable interaction diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dockable-e2e-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/dockable-e2e
          if-no-files-found: ignore
