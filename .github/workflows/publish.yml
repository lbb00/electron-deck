name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Emits the OIDC token so `npm publish --provenance` can sign the package
      # with GitHub-Actions attestation (publish provenance, Sigstore).
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Reject a tag that does not match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match package version v$VERSION" >&2
            exit 1
          fi

      # Idempotent: a tag/re-dispatch of an already-released version must not
      # fail the run — publish only when the version is not on the registry yet.
      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "Already published: $PKG@$VER — skipping publish"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
